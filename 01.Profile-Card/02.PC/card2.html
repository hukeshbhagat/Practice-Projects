<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile-2</title>
    <link rel="stylesheet" href="card2.css" />
  </head>
  <body>
    <div class="profile-card">
      <div class="info-box">
        <img src="Images/profile.jpg" alt="" />
        <div class="info">
          <h1>Hannah Parker</h1>
          <p>Web Developer</p>
        </div>
      </div>

      <div class="numbers-grid">
        <div class="box">
          <p>162</p>
          <p>Posts</p>
        </div>

        <div class="box">
          <p>230k</p>
          <p>Followers</p>
        </div>

        <div class="box">
          <p>22</p>
          <p>Following</p>
        </div>
      </div>

      <div class="btn-box">
        <button class="follow">Follow</button>
        <button class="message">Message</button>
      </div>
    </div>
  </body>
</html>
