<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Banner</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="image_container">
        <img src="images/bg_image.png" alt="Bg-Image" />
        </div>
        <div class="content">
          <img src="images/burger.png" alt="" class="burger" />
          <img src="images/tomato.png" alt="" class="tomato-1" />
          <img src="images/tomato.png" alt="" class="tomato-2" />

          <img src="images/pizza.png" alt="" class="pizza" />

          <img src="images/momo.png" alt="" class="momo" />

          <img src="images/leaf.png" alt="" class="leaf" />
        </div>

        <div class="center-content">
          <section class="text-content">
            <h1>Better food for more people</h1>
            <p>
              For over a decade, we’ve enabled our customers to discover new
              tastes, delivered right to their doorstep
            </p>
          </section>

          <section class="info-section">
            <div class="info-item">
              <img
                src="images/house.png"
                alt="Restaurant Icon"
                class="info-icon"
              />
            </div>
            <div class="info-text">
              <span class="info-number">3,00,000+</span>
              <span class="info-label">Restaurants</span>
            </div>

            <div class="info-item">
              <img
                src="images/location.png"
                alt="Restaurant Icon"
                class="info-icon"
              />
            </div>
            <div class="info-text">
              <span class="info-number">800+</span>
              <span class="info-label">cities</span>
            </div>

            <div class="info-item">
              <img
                src="images/banner.png"
                alt="Restaurant Icon"
                class="info-icon"
              />
            </div>

            <div class="info-text">
              <span class="info-number">3 billion+</span>
              <span class="info-label">orders delivered</span>
            </div>
          </section>
        </div>
      
    </main>
  </body>
</html>
