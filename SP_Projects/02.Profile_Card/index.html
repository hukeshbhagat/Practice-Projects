<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-contain">
      <div class="image">
        <img class="profile" src="Image/profile.jpg" alt="profile-img" />
      </div>
      <div class="data"><h2>Olivia Gomez</h2></div>
      <p class="roll">Developer & Designer</p>

      <div class="follow-btn">
        <div class="info">
          <p>Following</p>
          <p class="num">120</p>
        </div>

        <div class="info">
          <p>Followers</p>
          <p class="num">5000</p>
        </div>

        <div class="info">
          <p>Posts</p>
          <p class="num">209</p>
        </div>
      </div>

      <div class="main-btn">
        <button>Message</button>
        <button>Follow Me</button>
      </div>
    </div>
  </body>
</html>
